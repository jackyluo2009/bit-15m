<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BTC 15M">
<meta name="theme-color" content="#0b0d12">
<title>BTC 15M Higher / Lower</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--text:#f5f7fa;--muted:#8d97a6;--line:#292f3a;--green:#35d07f;--red:#ff5c6c;--yellow:#f4c95d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:560px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:800;font-size:18px}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-right:5px}.ok{background:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:end;gap:12px}.label{font-size:12px;color:var(--muted)}.price{font-size:36px;font-weight:800;line-height:1.05}.target{display:flex;gap:10px;margin-top:12px}input{flex:1;background:#10141b;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font-size:17px}button{background:#fff;color:#111;border:0;border-radius:14px;padding:13px 16px;font-weight:800}.meta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;gap:10px}.hero{text-align:center}.side{font-size:36px;font-weight:900}.higher{color:var(--green)}.lower{color:var(--red)}.neutral{color:var(--yellow)}.prob{font-size:48px;font-weight:900}.sub{color:var(--muted);font-size:13px}.bar{height:9px;background:#252b35;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:50%;background:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#11151c;padding:12px;border-radius:14px}.metric .v{font-size:17px;font-weight:800;margin-top:4px}.note{font-size:12px;color:var(--muted);line-height:1.6}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">₿ BTC 15M</div><div class="status"><span id="dot" class="dot"></span><span id="status">连接中</span></div></div>
<div class="card"><div class="row"><div><div class="label">BTC / USD</div><div id="price" class="price">—</div></div><div style="text-align:right"><div class="label">目标距离</div><div id="gap" class="note">—</div></div></div><div class="target"><input id="target" type="number" inputmode="decimal" placeholder="目标价，例如 118500"><button id="apply">应用</button></div><div class="meta"><span>结算目标：<b id="targetShow">未设置</b></span><span id="count">--:--</span></div></div>
<div class="card hero"><div class="label">15分钟 Higher / Lower</div><div id="side" class="side neutral">等待</div><div id="prob" class="prob">50%</div><div id="sub" class="sub">Higher 50% · Lower 50%</div><div class="bar"><div id="fill" class="fill"></div></div><div id="score" class="note">方向评分：50 / 100</div></div>
<div class="card"><div class="grid"><div class="metric"><div class="label">15m典型波动</div><div id="sigma" class="v">—</div></div><div class="metric"><div class="label">1m / 3m / 5m</div><div id="mom" class="v">—</div></div><div class="metric"><div class="label">成交量倍率</div><div id="vol" class="v">—</div></div><div class="metric"><div class="label">OI变化</div><div id="oi" class="v">—</div></div><div class="metric"><div class="label">Funding</div><div id="funding" class="v">—</div></div><div class="metric"><div class="label">数据源</div><div id="source" class="v">—</div></div></div></div>
<div class="card"><div class="note"><b>注意：</b>这是辅助研究模型，不是保证胜率。页面不会自动下单。</div></div>
</div>
<script>
const S={price:null,target:null,closes:[],volumes:[],oiHist:[],funding:0};const $=id=>document.getElementById(id);const cl=(x,a,b)=>Math.max(a,Math.min(b,x));const pct=(a,b)=>a&&b?(b/a-1)*100:0;function fmt(x,d=2){return Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}function status(ok,t){$('dot').className='dot '+(ok?'ok':'');$('status').textContent=t}
$('apply').onclick=()=>{let x=parseFloat($('target').value);if(Number.isFinite(x)&&x>0){S.target=x;$('targetShow').textContent='$'+fmt(x);render()}};$('target').onkeydown=e=>{if(e.key==='Enter')$('apply').click()};
function render(){if(S.price==null)return;$('price').textContent='$'+fmt(S.price);if(S.target){let g=S.target-S.price;$('gap').textContent=(g>=0?'+':'')+fmt(g)+' ('+(g/S.price*100).toFixed(3)+'%)'}compute()}
function compute(){if(!S.target||S.closes.length<8)return;let c=S.closes,p=S.price,m1=pct(c.at(-2),p),m3=pct(c.at(-4),p),m5=pct(c.at(-6),p),r=[];for(let i=1;i<c.length;i++)r.push(Math.log(c[i]/c[i-1]));r=r.slice(-30);let mean=r.reduce((a,x)=>a+x,0)/Math.max(1,r.length),va=r.length>4?r.reduce((a,x)=>a+(x-mean)**2,0)/(r.length-1):1e-6,sd=Math.sqrt(va),sigma=p*sd*Math.sqrt(15),avg=S.volumes.slice(-20).reduce((a,x)=>a+x,0)/Math.max(1,Math.min(20,S.volumes.length)),vr=(S.volumes.at(-1)||avg)/(avg||1),dir=50+18*cl(m1/.1,-1,1)+12*cl(m3/.18,-1,1)+8*cl(m5/.3,-1,1)+4*cl((vr-1)/.5,-1,1),gap=S.target-p,z=gap/Math.max(sigma,p*.0005),score=cl((dir-50)/50-z,-3,3),hp=cl(1/(1+Math.exp(-2.2*score)),.08,.92),lp=1-hp,side=hp>=lp?'HIGHER':'LOWER',prob=Math.max(hp,lp);$('side').textContent=side;$('side').className='side '+(side==='HIGHER'?'higher':'lower');$('prob').textContent=(prob*100).toFixed(1)+'%';$('sub').textContent='Higher '+(hp*100).toFixed(1)+'% · Lower '+(lp*100).toFixed(1)+'%';$('fill').style.width=(hp*100)+'%';$('fill').style.background=side==='HIGHER'?'var(--green)':'var(--red)';$('score').textContent='方向评分：'+dir.toFixed(1)+' / 100';$('sigma').textContent='±$'+fmt(sigma,0);$('mom').textContent=m1.toFixed(2)+'% / '+m3.toFixed(2)+'% / '+m5.toFixed(2)+'%';$('vol').textContent=vr.toFixed(2)+'x';$('oi').textContent=S.oiHist.length>1?(((S.oiHist.at(-1).v/S.oiHist[0].v)-1)*100).toFixed(3)+'%':'—';$('funding').textContent=S.funding?S.funding.toFixed(5):'—'}
function countdown(){let d=new Date(),next=new Date(d),nm=(Math.floor(d.getMinutes()/15)+1)*15;next.setSeconds(0,0);next.setMinutes(nm);if(nm>=60)next.setHours(d.getHours()+1,0,0,0);let s=Math.max(0,Math.floor((next-Date.now())/1000));$('count').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(countdown,250);countdown();
async function priceFallback(){try{let r=await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot?x='+Date.now(),{cache:'no-store'});let d=await r.json(),p=+d.data.amount;if(Number.isFinite(p)){S.price=p;$('source').textContent='Coinbase';status(true,'行情正常');if(!S.closes.length)S.closes=[p];else S.closes[S.closes.length-1]=p;render()}}catch(e){status(false,'重试中')}}
async function candles(){try{let r=await fetch('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60&x='+Date.now(),{cache:'no-store'});let d=await r.json();d=d.slice().sort((a,b)=>a[0]-b[0]);S.closes=d.map(x=>+x[4]);S.volumes=d.map(x=>+x[5]);if(S.price)S.closes[S.closes.length-1]=S.price;render()}catch(e){}}
function live(){try{let ws=new WebSocket('wss://advanced-trade-ws.coinbase.com');ws.onopen=()=>{ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD'],channel:'ticker'}));status(true,'实时已连接')};ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.channel!=='ticker')return;(d.events||[]).forEach(ev=>(ev.tickers||[]).forEach(t=>{if(t.product_id==='BTC-USD'){let p=+t.price;if(Number.isFinite(p)){S.price=p;$('source').textContent='Coinbase WS';if(S.closes.length)S.closes[S.closes.length-1]=p;render()}}}))}catch(x){}};ws.onclose=()=>{status(false,'重新连接');setTimeout(live,3000)};ws.onerror=()=>{try{ws.close()}catch(e){}}}catch(e){setTimeout(live,3000)}}
async function deriv(){try{let [a,b]=await Promise.all([fetch('https://fapi.binance.com/fapi/v1/openInterest?symbol=BTCUSDT&x='+Date.now(),{cache:'no-store'}),fetch('https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=1&x='+Date.now(),{cache:'no-store'})]);let oi=await a.json(),fr=await b.json();S.oiHist.push({t:Date.now(),v:+oi.openInterest});if(S.oiHist.length>20)S.oiHist.shift();if(Array.isArray(fr)&&fr.length)S.funding=+fr[0].fundingRate;render()}catch(e){}}
(async()=>{await candles();await priceFallback();live();deriv();setInterval(priceFallback,5000);setInterval(candles,60000);setInterval(deriv,30000);setInterval(render,1000)})();
</script></body></html>
